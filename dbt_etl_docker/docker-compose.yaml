name: "cde-etl-dbt"

services:
  python-data-extract:
    image: extract-data
    build:
      context: .
      dockerfile: Dockerfile.extract
    hostname: extract-data
    environment:
      - PG_HOST=postgres
      - PG_USER=bootcamp
      - PG_PASSWD=bootcamp
      - PG_DB=Staging_DB
      # - PG_PORT=5432
    depends_on:
      - postgres
    volumes:
      - ./extract.py:/home/etl/extract.py
    networks:
      - etl-network

  postgres:
    image: postgres:14
    hostname: postgres
    environment:
      - POSTGRES_USER=bootcamp
      - POSTGRES_PASSWORD=bootcamp
      - POSTGRES_DB=Staging_DB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ddls:/docker-entrypoint-initdb.d
    networks:
      - etl-network

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    hostname: dbt
    # entrypoint: [ "bash" ]
    command: run --profiles-dir /root/.dbt --profile CupScope --target dev --project-dir /usr/app/dbt/CupScope --select WorldCupCleaned_STG
    volumes:
      - ./dbt:/usr/app/dbt
      - ~/.dbt/profiles.yml:/root/.dbt/profiles.yml
    networks:
      - etl-network
    depends_on:
      - postgres
      - python-data-extract

  metabase:
    image: metabase/metabase:v0.56.9
    ports:
      - "3000:3000"
    networks:
      - etl-network

volumes:
  pgdata:

networks:
  etl-network:
